name: Test

# The module is publicly installable, so a regression reaches users directly.
# Run the suite on every push and PR, and before any release tag is cut.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # happy-dom is the only dependency, and it is dev-only: the shipped
      # module stays dependency-free (the release zip excludes package.json
      # and node_modules).
      - name: Install dev dependencies
        run: npm ci

      - name: Run tests
        run: npm test
