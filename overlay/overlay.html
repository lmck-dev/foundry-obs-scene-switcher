<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>OBS Scene Switcher — Character Overlay</title>
<!--
  Point an OBS Browser Source at this file. It renders whichever character the
  scene switcher last put on screen and updates live, with no page reload.

  Optional query parameters:
    ?accent=%23c0392b   accent colour (URL-encode the #)
    &scale=1.25         overall size multiplier
    &anchor=top         grow downward from the top instead of up from the bottom
    &event=myEventName  match a custom event name set in the module settings

  Every element has a stable class name, so OBS's own "Custom CSS" box can
  restyle any part of this without editing the file.
-->
<style>
  :root {
    --accent: #d4a24a;
    --scale: 1;
    --card-bg: rgba(12, 14, 18, 0.82);
    --text: #f4f2ee;
    --muted: rgba(244, 242, 238, 0.66);
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    /* OBS composites this over your scene — never paint a background. */
    background: transparent;
    overflow: hidden;
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  body {
    display: flex;
    padding: 12px;
    box-sizing: border-box;
  }

  .overlay-root {
    width: 100%;
    display: flex;
    font-size: calc(16px * var(--scale));
    transition: opacity 320ms ease, transform 320ms ease;
  }

  .overlay-root[data-anchor="bottom"] { align-items: flex-end; }
  .overlay-root[data-anchor="top"]    { align-items: flex-start; }

  /* Nothing to show: fade out rather than pop, so a turn ending looks intentional. */
  .overlay-root[data-state="empty"] {
    opacity: 0;
    transform: translateY(10px);
  }

  .overlay-root[data-state="shown"] {
    opacity: 1;
    transform: none;
  }

  .card {
    display: flex;
    gap: 0.85em;
    align-items: center;
    box-sizing: border-box;
    padding: 0.8em 1.1em 0.8em 0.9em;
    border: 1px solid rgba(255, 255, 255, 0.09);
    border-left: 4px solid var(--accent);
    border-radius: 0.65em;
    background: var(--card-bg);
    backdrop-filter: blur(7px);
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.5);
    max-width: 100%;
  }

  .overlay-root.swap .card {
    animation: obs-overlay-in 420ms cubic-bezier(0.2, 0.8, 0.3, 1);
  }

  @keyframes obs-overlay-in {
    from { opacity: 0; transform: translateY(14px) scale(0.985); }
    to   { opacity: 1; transform: none; }
  }

  .portrait {
    width: 5.2em;
    /* Grow with the card so a full stat block does not dwarf the portrait,
       but never shrink below square when only a couple of rows are on. */
    align-self: stretch;
    height: auto;
    min-height: 5.2em;
    flex: 0 0 auto;
    object-fit: cover;
    /* Crop towards the bottom: character art puts the face near the top. */
    object-position: center 25%;
    border-radius: 0.5em;
    background: rgba(255, 255, 255, 0.05);
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.14);
  }

  .body {
    display: flex;
    flex-direction: column;
    gap: 0.3em;
    min-width: 0;
  }

  .name {
    font-size: 1.32em;
    font-weight: 700;
    line-height: 1.1;
    letter-spacing: 0.01em;
    text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .subtitle {
    font-size: 0.76em;
    text-transform: uppercase;
    letter-spacing: 0.11em;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Hit points */
  .hp {
    display: flex;
    align-items: center;
    gap: 0.55em;
    margin-top: 0.15em;
  }

  .hp-bar {
    position: relative;
    width: 11em;
    height: 0.5em;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.13);
    overflow: hidden;
  }

  .hp-fill {
    height: 100%;
    border-radius: inherit;
    background: linear-gradient(90deg, #3f9d55, #63c777);
    transition: width 450ms cubic-bezier(0.4, 0, 0.2, 1), background 450ms ease;
  }

  .hp.mid .hp-fill { background: linear-gradient(90deg, #b8862a, #e0b84a); }
  .hp.low .hp-fill { background: linear-gradient(90deg, #a52222, #e04b4b); }

  /* No maximum known — the track would imply a full bar, so hide it. */
  .hp.unknown-max .hp-bar { display: none; }

  .hp-text {
    font-size: 0.85em;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  /* AC / speed / passive perception */
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4em;
    margin-top: 0.15em;
  }

  .chip {
    display: flex;
    align-items: baseline;
    gap: 0.3em;
    padding: 0.18em 0.5em;
    border-radius: 0.3em;
    background: rgba(255, 255, 255, 0.07);
    font-size: 0.8em;
  }

  .chip-label {
    font-size: 0.82em;
    letter-spacing: 0.08em;
    color: var(--muted);
  }

  .chip-value {
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  /* Ability scores */
  .abilities {
    display: flex;
    flex-wrap: wrap;
    gap: 0.35em;
    margin-top: 0.2em;
  }

  .ability {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 2.4em;
    padding: 0.2em 0.35em;
    border-radius: 0.3em;
    background: rgba(255, 255, 255, 0.06);
    line-height: 1.15;
  }

  .ability-label {
    font-size: 0.6em;
    letter-spacing: 0.1em;
    color: var(--muted);
  }

  .ability-value {
    font-size: 0.86em;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  /* Active conditions */
  .conditions {
    display: flex;
    flex-wrap: wrap;
    gap: 0.3em;
    margin-top: 0.2em;
  }

  .condition {
    display: flex;
    align-items: center;
    gap: 0.28em;
    padding: 0.15em 0.45em;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.13);
    background: rgba(255, 255, 255, 0.05);
    font-size: 0.72em;
  }

  .condition-icon {
    width: 1.15em;
    height: 1.15em;
    border-radius: 50%;
    object-fit: cover;
  }

  [hidden] { display: none !important; }

  @media (prefers-reduced-motion: reduce) {
    .overlay-root, .hp-fill { transition: none; }
    .overlay-root.swap .card { animation: none; }
  }
</style>
</head>
<body>
  <div id="obs-overlay-root" class="overlay-root" data-state="empty" data-anchor="bottom">
    <div class="card">
      <img class="portrait" alt="" hidden />
      <div class="body">
        <div class="name"></div>
        <div class="subtitle" hidden></div>
        <div class="hp" hidden>
          <div class="hp-bar"><div class="hp-fill"></div></div>
          <div class="hp-text"></div>
        </div>
        <div class="chips" hidden></div>
        <div class="abilities" hidden></div>
        <div class="conditions" hidden></div>
      </div>
    </div>
  </div>
  <script src="common.js"></script>
  <script src="overlay.js"></script>
</body>
</html>
