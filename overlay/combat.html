<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>OBS Scene Switcher — Combat Tracker</title>
<!--
  Point an OBS Browser Source at this file. It shows the current turn order,
  with whoever is up highlighted, and hides itself when combat ends.

  Optional query parameters (typed file:/// URLs only — OBS's "Local file" tick
  gives the page no query string):
    ?accent=%23c0392b   accent colour (URL-encode the #)
    &scale=1.1          overall size multiplier
    &anchor=top         pin to the top of the source instead of the bottom
    &event=myEventName  match a custom event name set in the module settings

  Every element has a stable class name, so OBS's own "Custom CSS" box can
  restyle any part of this without editing the file.
-->
<style>
  :root {
    --accent: #d4a24a;
    --scale: 1;
    --card-bg: rgba(12, 14, 18, 0.82);
    --text: #f4f2ee;
    --muted: rgba(244, 242, 238, 0.66);
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    /* OBS composites this over your scene — never paint a background. */
    background: transparent;
    overflow: hidden;
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  body {
    display: flex;
    padding: 12px;
    box-sizing: border-box;
  }

  .combat-root {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 0.4em;
    font-size: calc(19px * var(--scale));
    transition: opacity 320ms ease;
  }

  .combat-root[data-anchor="bottom"] { justify-content: flex-end; }
  .combat-root[data-anchor="top"]    { justify-content: flex-start; }


  .combat-round {
    align-self: flex-start;
    padding: 0.2em 0.7em;
    border-radius: 999px;
    background: var(--accent);
    color: #17130a;
    font-size: 0.85em;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .combat-list {
    display: flex;
    flex-direction: column;
    gap: 0.3em;
  }

  .combat-row {
    display: flex;
    gap: 0.6em;
    align-items: center;
    box-sizing: border-box;
    padding: 0.4em 0.6em;
    border: 1px solid rgba(255, 255, 255, 0.09);
    border-left: 3px solid transparent;
    border-radius: 0.45em;
    background: var(--card-bg);
    backdrop-filter: blur(7px);
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
    transition: border-color 250ms ease, background 250ms ease;
  }

  /* Whose turn it is has to be readable at a glance, at stream bitrates. */
  .combat-row.active {
    border-left-color: var(--accent);
    background: rgba(38, 32, 18, 0.9);
    box-shadow: 0 6px 22px rgba(0, 0, 0, 0.55), 0 0 0 1px var(--accent) inset;
  }

  .combat-row.defeated { opacity: 0.45; }
  .combat-row.defeated .combat-name { text-decoration: line-through; }

  .combat-name {
    flex: 1 1 auto;
    min-width: 0;
    font-size: 1.05em;
    font-weight: 600;
    line-height: 1.2;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .combat-init {
    flex: 0 0 auto;
    min-width: 2em;
    padding: 0.2em 0.4em;
    border-radius: 0.3em;
    background: rgba(255, 255, 255, 0.07);
    font-size: 0.95em;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    text-align: center;
  }

  .combat-row.active .combat-init {
    background: var(--accent);
    color: #17130a;
  }


  /* Proof of life.
     A panel with nothing to show used to be fully transparent, which is
     indistinguishable from a page that never loaded, a Browser Source pointed
     at the wrong file, or a module that is not sending. It is now always
     visibly *something*, and says which of those it is: `data-live` is set to
     "yes" by common.js the first time any payload arrives. Add ?idle=hide to
     the source URL to suppress it once you are happy and going live. */
  .idle {
    display: none;
    align-items: center;
    gap: 0.5em;
    align-self: flex-start;
    padding: 0.35em 0.7em;
    border: 1px dashed rgba(255, 255, 255, 0.22);
    border-radius: 0.4em;
    background: rgba(12, 14, 18, 0.55);
    color: var(--muted);
    font-size: 0.8em;
    letter-spacing: 0.04em;
    white-space: nowrap;
  }

  [data-state="empty"][data-idle="show"] .idle { display: inline-flex; }

  .idle-dot {
    width: 0.5em;
    height: 0.5em;
    border-radius: 50%;
    background: #e0b84a;
    box-shadow: 0 0 0.5em rgba(224, 184, 74, 0.8);
    animation: obs-idle-pulse 1.6s ease-in-out infinite;
  }

  [data-live="yes"] .idle-dot {
    background: #63c777;
    box-shadow: 0 0 0.5em rgba(99, 199, 119, 0.8);
  }

  @keyframes obs-idle-pulse {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.35; }
  }

  /* One line or the other, never both. */
  .idle-live { display: none; }
  [data-live="yes"] .idle-waiting { display: none; }
  [data-live="yes"] .idle-live { display: inline; }

  [hidden] { display: none !important; }

  @media (prefers-reduced-motion: reduce) {
    .combat-root, .combat-row { transition: none; }
  }
</style>
</head>
<body>
  <div id="obs-combat-root" class="combat-root" data-state="empty" data-anchor="bottom">
    <div class="combat-round" hidden></div>
    <div class="combat-list"></div>
    <div class="idle">
      <span class="idle-dot"></span>
      <span class="idle-waiting">Combat tracker — waiting for Foundry…</span>
      <span class="idle-live">Combat tracker — no encounter</span>
    </div>
  </div>
  <script src="common.js"></script>
  <script src="combat.js"></script>
</body>
</html>
