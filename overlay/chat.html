<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>OBS Scene Switcher — Chat Feed</title>
<!--
  Point an OBS Browser Source at this file. It shows the tail of the Foundry
  chat log, filtered by the rules in the module's "Stream Overlays" settings.

  Optional query parameters (typed file:/// URLs only — OBS's "Local file" tick
  gives the page no query string):
    ?accent=%23c0392b   accent colour (URL-encode the #)
    &scale=1.1          overall size multiplier
    &anchor=top         newest at the top instead of the bottom
    &event=myEventName  match a custom event name set in the module settings

  Every element has a stable class name, so OBS's own "Custom CSS" box can
  restyle any part of this without editing the file.
-->
<style>
  :root {
    --accent: #d4a24a;
    --scale: 1;
    --card-bg: rgba(12, 14, 18, 0.82);
    --text: #f4f2ee;
    --muted: rgba(244, 242, 238, 0.66);
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    /* OBS composites this over your scene — never paint a background. */
    background: transparent;
    overflow: hidden;
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  body {
    display: flex;
    padding: 12px;
    box-sizing: border-box;
  }

  .chat-root {
    width: 100%;
    display: flex;
    font-size: calc(19px * var(--scale));
    transition: opacity 320ms ease;
  }

  /* Newest at the bottom by default: the eye rests where the last line lands. */
  .chat-root[data-anchor="bottom"] { align-items: flex-end; }
  .chat-root[data-anchor="top"]    { align-items: flex-start; }


  .chat-lines {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 0.4em;
  }

  /* Anchored to the top, the newest line is first rather than last. */
  .chat-root[data-anchor="top"] .chat-lines { flex-direction: column-reverse; }

  .chat-line {
    display: flex;
    gap: 0.6em;
    align-items: flex-start;
    box-sizing: border-box;
    padding: 0.5em 0.7em;
    border: 1px solid rgba(255, 255, 255, 0.09);
    border-left: 3px solid var(--accent);
    border-radius: 0.5em;
    background: var(--card-bg);
    backdrop-filter: blur(7px);
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
  }

  /* Only lines that were not on screen a moment ago animate in. Animating on
     every render made the whole panel flash each time anything changed. */
  .chat-line.is-new {
    animation: obs-chat-in 300ms cubic-bezier(0.2, 0.8, 0.3, 1);
  }

  /* Rolls read as results rather than speech, so they get their own edge. */
  .chat-line[data-category="roll"]  { border-left-color: rgba(255, 255, 255, 0.35); }
  .chat-line[data-category="emote"] .chat-text { font-style: italic; }
  .chat-line[data-category="ooc"]   { opacity: 0.9; }

  @keyframes obs-chat-in {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: none; }
  }

  .chat-avatar {
    width: 2.2em;
    height: 2.2em;
    flex: 0 0 auto;
    object-fit: cover;
    object-position: center 25%;
    border-radius: 0.35em;
    background: rgba(255, 255, 255, 0.05);
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.14);
  }

  .chat-body {
    display: flex;
    flex-direction: column;
    gap: 0.15em;
    min-width: 0;
    flex: 1 1 auto;
  }

  .chat-alias {
    font-size: 0.88em;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--accent);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .chat-text {
    font-size: 1em;
    line-height: 1.35;
    /* Long messages wrap rather than pushing the panel out of frame. */
    overflow-wrap: anywhere;
  }

  .chat-rolls {
    display: flex;
    flex-wrap: wrap;
    gap: 0.35em;
    margin-top: 0.2em;
  }

  .chat-roll {
    display: flex;
    align-items: baseline;
    gap: 0.45em;
    padding: 0.15em 0.5em;
    border-radius: 0.3em;
    background: rgba(255, 255, 255, 0.07);
  }

  .chat-roll-formula {
    font-size: 0.82em;
    letter-spacing: 0.05em;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  .chat-roll-total {
    font-size: 1.1em;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }


  /* Proof of life.
     A panel with nothing to show used to be fully transparent, which is
     indistinguishable from a page that never loaded, a Browser Source pointed
     at the wrong file, or a module that is not sending. It is now always
     visibly *something*, and says which of those it is: `data-live` is set to
     "yes" by common.js the first time any payload arrives. Add ?idle=hide to
     the source URL to suppress it once you are happy and going live. */
  .idle {
    display: none;
    align-items: center;
    gap: 0.5em;
    align-self: flex-start;
    padding: 0.35em 0.7em;
    border: 1px dashed rgba(255, 255, 255, 0.22);
    border-radius: 0.4em;
    background: rgba(12, 14, 18, 0.55);
    color: var(--muted);
    font-size: 0.8em;
    letter-spacing: 0.04em;
    white-space: nowrap;
  }

  [data-state="empty"][data-idle="show"] .idle { display: inline-flex; }

  .idle-dot {
    width: 0.5em;
    height: 0.5em;
    border-radius: 50%;
    background: #e0b84a;
    box-shadow: 0 0 0.5em rgba(224, 184, 74, 0.8);
    animation: obs-idle-pulse 1.6s ease-in-out infinite;
  }

  [data-live="yes"] .idle-dot {
    background: #63c777;
    box-shadow: 0 0 0.5em rgba(99, 199, 119, 0.8);
  }

  @keyframes obs-idle-pulse {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.35; }
  }

  /* One line or the other, never both. */
  .idle-live { display: none; }
  [data-live="yes"] .idle-waiting { display: none; }
  [data-live="yes"] .idle-live { display: inline; }

  [hidden] { display: none !important; }

  @media (prefers-reduced-motion: reduce) {
    .chat-root { transition: none; }
    .chat-line.is-new { animation: none; }
  }
</style>
</head>
<body>
  <div id="obs-chat-root" class="chat-root" data-state="empty" data-anchor="bottom">
    <div class="chat-lines"></div>
    <div class="idle">
      <span class="idle-dot"></span>
      <span class="idle-waiting">Chat feed — waiting for Foundry…</span>
      <span class="idle-live">Chat feed — no messages yet</span>
    </div>
  </div>
  <script src="common.js"></script>
  <script src="chat.js"></script>
</body>
</html>
